name: keep-alive

# 两组 cron 错开 5 分钟，实际效果：每 5 分钟 ping 一次
on:
  workflow_dispatch:
  schedule:
    - cron: '0,10,20,30,40,50 * * * *'
    - cron: '5,15,25,35,45,55 * * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping health endpoint
        run: |
          echo "ping at $(date -u)"
          code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 110 -L \
            "https://report-assistant-ye91.onrender.com/api/health" || echo "000")
          echo "HTTP status: $code"
          head -c 300 /tmp/body 2>/dev/null; echo

  # 每月 1 号空提交一次：GitHub 会在仓库 60 天无活动时停用定时任务，此任务保证永不被停用
  keep-workflow-active:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || true
    needs: ping
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Monthly empty commit
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflows active"
          git push